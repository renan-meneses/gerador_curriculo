apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-ingress
  namespace: resume-builder
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - resume.example.com
      secretName: resume-tls
  rules:
    - host: resume.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: resume-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-frontend
                port:
                  number: 3000
