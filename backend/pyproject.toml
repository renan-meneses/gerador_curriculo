[project]
name = "resume-builder-api"
version = "1.0.0"
description = "AI-powered resume builder with LinkedIn import, Markdown, custom templates, and Gemini API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.4",
    "google-generativeai>=0.8.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-docx>=1.1",
    "weasyprint>=62",
    "markdown>=3.6",
    "bleach>=6.1",
    "lxml>=5.0",
    "Pillow>=10.0",
    "boto3>=1.35",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
    "httpx>=0.27",
    "aiofiles>=24.0",
    "python-dateutil>=2.9",
    "email-validator>=2.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "factory-boy>=3.3",
    "faker>=26.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "EM", "ERA", "PD", "PT", "PTH", "RUF", "S", "SLF", "TID", "TCH", "TRY"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
